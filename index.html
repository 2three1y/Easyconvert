<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.6rem;margin:.25rem}button{background:#075985;color:#fff}.viewer{border:1px solid #b8c5cf;margin:.5rem 0}.viewer-toggle{width:100%;text-align:left;background:#fff;color:#17202a}.viewer-body{padding:1rem;border-top:1px solid #b8c5cf}pre{white-space:pre-wrap;max-height:20rem;overflow:auto}</style></head>
<body><header><h1>Easyconvert</h1></header><main><section><h2>Add files</h2><input id="files" type="file" multiple><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section><section><label for="format">Format</label><select id="format"><option value="txt">TXT / Markdown</option><option value="html">HTML</option><option value="json">Formatted JSON</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" type="button" disabled>Convert</button></section><section id="results-section" hidden><h2>Results</h2><ul id="results"></ul><button id="export-all" type="button">Export all</button><p id="result-status" role="status" aria-live="polite"></p></section></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';let files=[],out=[];const xml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&apos;');function save(n,d,t='application/octet-stream'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function formatText(name,text){if(/\.json$/i.test(name)){try{return JSON.stringify(JSON.parse(text),null,2)}catch{}}return text}async function readSources(file){if(!/\.zip$/i.test(file.name)&&!/zip/.test(file.type))return[{name:file.name,content:formatText(file.name,await file.text())}];if(typeof JSZip==='undefined')throw Error('ZIP library failed to load');const zip=await JSZip.loadAsync(await file.arrayBuffer()),allowed=/\.(json|txt|md|csv)$/i,s=[];for(const [name,entry] of Object.entries(zip.files)){if(!entry.dir&&allowed.test(name))s.push({name,content:formatText(name,await entry.async('string'))})}return s}async function makeDocx(text){if(typeof JSZip==='undefined')throw Error('DOCX library failed to load');const body=String(text).split(/\r?\n/).map(line=>`<w:p>${/^#\s+/.test(line)?'<w:pPr><w:pStyle w:val="Heading1"/></w:pPr>':''}<w:r><w:t xml:space="preserve">${xml(line.replace(/^#\s+/,'' )||' ')}</w:t></w:r></w:p>`).join(''),z=new JSZip();z.file('[Content_Types].xml','<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`);return z.generateAsync({type:'blob',mimeType:DOCX})}function render(){const l=$("file-list");l.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.textContent=f.name+' ';const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{files.splice(i,1);render()};li.append(b);l.append(li)});$("batch-options").hidden=files.length<2;$("convert").disabled=!files.length;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} selected`:'No files selected'}$("files").onchange=e=>{files.push(...Array.from(e.target.files||[]));e.target.value='';render()};$("convert").onclick=async()=>{const b=$("convert");b.disabled=true;try{out=[];for(const f of files)out.push(...await readSources(f));$("results-section").hidden=false;$("result-status").textContent=`${out.length} text file${out.length===1?'':'s'} ready`;$("status").textContent='Conversion complete'}catch(e){console.error(e);$("status").textContent=`Conversion failed: ${e.message}`}finally{b.disabled=!files.length}};$("export-all").onclick=async()=>{try{const ext=$("format").value;if($("single-export").checked){const merged=out.map(o=>`# ${o.name}\n\n${o.content}`).join('\n\n');if(ext==='docx')save('Easyconvert-merged.docx',await makeDocx(merged),DOCX);else save(`Easyconvert-merged.${ext}`,merged,'text/plain')}else if(ext==='docx'){for(const o of out)save(o.name.replace(/\.[^.]+$/i,'.docx'),await makeDocx(`# ${o.name}\n\n${o.content}`),DOCX)}else{if(typeof JSZip==='undefined')throw Error('ZIP library failed to load');const z=new JSZip();out.forEach(o=>z.file(o.name,o.content));save('Easyconvert-bundle.zip',await z.generateAsync({type:'blob'}),'application/zip')}$("result-status").textContent='Export complete'}catch(e){console.error(e);$("result-status").textContent=`Export failed: ${e.message}`}};render()})();</script></body></html>
