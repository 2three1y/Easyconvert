<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,input,select{font:inherit;padding:.5rem;margin:.25rem}.file{border-top:1px solid #aaa;padding:.75rem 0}.content{white-space:pre-wrap;max-height:20rem;overflow:auto;background:#f5f5f5;padding:.5rem}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input id="input" type="file" multiple><select id="format" aria-label="Output format"><optgroup label="Documents"><option>TXT / Markdown</option><option>DOCX</option><option>PDF</option><option>HTML</option></optgroup><optgroup label="Data"><option>JSON</option><option>CSV</option></optgroup><optgroup label="Archives"><option>ZIP archive</option></optgroup></select><label><input id="single" type="checkbox"> Single file</label><label><input id="strip" type="checkbox"> Strip images</label><button id="convert">Convert</button><section aria-labelledby="vt"><h2 id="vt">File viewer</h2><button id="toggle" aria-expanded="true" aria-controls="list">Collapse viewer</button><button id="copyall">Copy all</button><button id="downall">Download all</button><div id="list" tabindex="-1">No files selected.</div></section><p id="status" role="status" aria-live="polite">No files selected.</p><script>(()=>{const $=x=>document.getElementById(x);let fs=[],out=[],busy=false;const say=x=>$('status').textContent=x,download=(n,d)=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:'text/plain'}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};function render(){let l=$('list');l.replaceChildren();if(!fs.length){l.textContent='No files selected.';return}fs.forEach((f,i)=>{let r=document.createElement('article');r.className='file';let h=document.createElement('div'),n=document.createElement('strong');n.textContent=f.name;let c=document.createElement('button');c.textContent='Copy';c.setAttribute('aria-label','Copy '+f.name);c.onclick=()=>navigator.clipboard.writeText(out[i]?.content||'').then(()=>say('Copied '+f.name));let d=document.createElement('button');d.textContent='Download';d.setAttribute('aria-label','Download '+f.name);d.onclick=()=>download(f.name,out[i]?.content||'');h.append(n,c,d);let p=document.createElement('pre');p.className='content';p.tabIndex=0;p.setAttribute('aria-label',f.name+' content');p.textContent=out[i]?.content||'Not converted yet.';r.append(h,p);l.append(r)})}$('input').onchange=e=>{fs.push(...e.target.files);render();say(`${fs.length} file(s) selected`)};$('toggle').onclick=()=>{let l=$('list'),open=$('toggle').getAttribute('aria-expanded')==='true';l.hidden=open;$('toggle').setAttribute('aria-expanded',String(!open));$('toggle').textContent=open?'Expand viewer':'Collapse viewer';if(!open)l.focus()};$('convert').onclick=async()=>{if(busy||!fs.length)return;busy=true;out=[];say('Converting…');try{for(let i=0;i<fs.length;i++){let f=fs[i];if(f.size>25*1024*1024)throw Error(`${f.name} exceeds the 25 MB safety limit`);let content=await f.text();if($('strip').checked)content=content.replace(/<img\b[^>]*>/gi,'').replace(/!\[[^]]*\]\([^)]*\)/g,'');out.push({name:f.name,content});await new Promise(requestAnimationFrame)}render();say('Conversion complete.')}catch(e){out=[];render();say('Conversion failed safely: '+e.message)}finally{busy=false}};$('copyall').onclick=()=>navigator.clipboard.writeText(out.map(x=>x.content).join('\n\n')).then(()=>say('Copied all file contents'));$('downall').onclick=()=>out.forEach(x=>download(x.name,x.content));render()})()</script></body></html>
