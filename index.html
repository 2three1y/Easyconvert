<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><h1>Easyconvert</h1><input id="fileInput" type="file" multiple><select id="format"><optgroup label="Documents"><option value="txt">TXT / Markdown</option><option value="docx">DOCX</option><option value="pdf">PDF</option><option value="html">HTML</option></optgroup><optgroup label="Data"><option value="json">JSON</option><option value="csv">CSV</option></optgroup><optgroup label="Archives"><option value="zip">ZIP archive</option></optgroup></select><label><input id="singleFile" type="checkbox"> Single file</label><label><input id="stripImages" type="checkbox"> Strip images for PDF/DOCX</label><button id="convert">Convert</button><button id="export" disabled>Export</button><p id="status">No files selected.</p><script>(()=>{const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),mime={txt:'text/plain',json:'application/json',csv:'text/csv',html:'text/html',pdf:'application/pdf'};let files=[],out=[];const dl=(n,d,t)=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};const structure=(n,c,strip)=>{if(strip)c=c.replace(/<img\b[^>]*>/gi,'').replace(/!\[[^]]*\]\([^)]*\)/g,'');return`Document: ${n}\n\n${c}\n\nThank you for using Easyconvert`};$('fileInput').onchange=e=>{files.push(...e.target.files);$('status').textContent=`${files.length} file(s) selected`;$('export').disabled=false};$('convert').onclick=async()=>{out=[];for(const f of files)out.push({name:f.name,content:await f.text()});$('status').textContent='Conversion complete.'};$('export').onclick=async()=>{let f=$('format').value,s=$('singleFile').checked,strip=$('stripImages').checked,items=out.map(x=>({name:x.name,content:structure(x.name,x.content,strip)})),merged=items.map(x=>x.content).join('\n\n');if(f==='zip'||(!s&&items.length>1)){let z=new JSZip();items.forEach(x=>z.file(x.name.replace(/\.[^.]+$/,'')+'.'+f,x.content));dl('Easyconvert-bundle.zip',await z.generateAsync({type:'arraybuffer'}),'application/zip')}else if(f==='json')dl('Easyconvert-merged.json',JSON.stringify(items),mime.json);else if(f==='csv')dl('Easyconvert-merged.csv','filename,content\n'+items.map(x=>`"${x.name}","${x.content.replace(/"/g,'""')}"`).join('\n'),mime.csv);else if(f==='html')dl('Easyconvert-merged.html',`<article><header>Easyconvert</header><pre>${esc(merged)}</pre><footer>Thank you for using Easyconvert</footer></article>`,mime.html);else dl(`Easyconvert-merged.${f}`,merged,mime[f]||'text/plain');$('status').textContent='Export complete.'}})()</script></body></html>
