<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easyconvert</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.6rem;margin:.25rem}button{background:#075985;color:white}.viewer{border:1px solid #b8c5cf;margin:.5rem 0}.viewer-toggle{width:100%;text-align:left;background:#fff;color:#17202a}.viewer-body{padding:1rem;border-top:1px solid #b8c5cf}pre{white-space:pre-wrap;max-height:20rem;overflow:auto}</style>
</head>
<body>
<header><h1>Easyconvert</h1></header>
<main>
<section><h2>Add files</h2><input id="files" type="file" multiple><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section>
<section><label for="format">Format</label><select id="format"><option value="txt">TXT / Markdown</option><option value="html">HTML</option><option value="json">Formatted JSON</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" type="button" disabled>Convert</button></section>
<section id="results-section" hidden><h2>Results</h2><ul id="results"></ul><button id="export-all" type="button">Export all</button><p id="result-status" role="status" aria-live="polite"></p></section>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';let files=[],out=[];
const xml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&apos;');
function save(name,data,type){const url=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function makeDocx(parts){if(typeof JSZip==='undefined')throw new Error('DOCX library failed to load');const body=parts.map(p=>`<w:p>${p.heading?'<w:pPr><w:pStyle w:val="Heading1"/></w:pPr>':''}<w:r><w:t xml:space="preserve">${xml(p.text||' ')}</w:t></w:r></w:p>`).join(''),z=new JSZip();z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`);z.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');z.file('word/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:qFormat/><w:rPr><w:b/><w:sz w:val="32"/></w:rPr></w:style></w:styles>');return z.generateAsync({type:'blob',mimeType:DOCX})}
function render(){const list=$("file-list");list.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.textContent=f.name+' ';const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{files.splice(i,1);render()};li.append(b);list.append(li)});$("batch-options").hidden=files.length<2;$("convert").disabled=!files.length;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} uploaded`:'No files selected'}
$("files").addEventListener('change',e=>{const selectedFiles=e.target.files||[];const normalized=Array.from(selectedFiles);files=files.concat(normalized);e.target.value='';render()});
$("convert").addEventListener('click',async()=>{const button=$("convert");button.disabled=true;try{out=[];const ext=$("format").value;for(const f of files){const text=await f.text();let data=text;if(ext==='json')try{data=JSON.stringify(JSON.parse(text),null,2)}catch{}if(ext==='html')data=`<!doctype html><html><body><pre>${xml(text)}</pre></body></html>`;out.push({name:f.name.replace(/\.[^.]+$/,'')+'.'+ext,data})}const list=$("results");list.replaceChildren();out.forEach(o=>{const li=document.createElement('li');li.className='viewer';const b=document.createElement('button');b.type='button';b.className='viewer-toggle';b.textContent=o.name;const body=document.createElement('div');body.className='viewer-body';body.hidden=true;const pre=document.createElement('pre');pre.textContent=o.data;body.append(pre);b.onclick=()=>{body.hidden=!body.hidden};li.append(b,body);list.append(li)});$("results-section").hidden=false;$("result-status").textContent=`${out.length} file${out.length===1?'':'s'} ready`;$("status").textContent='Conversion complete'}catch(error){console.error('Conversion failed:',error);$("status").textContent=`Conversion failed: ${error.message}`}finally{button.disabled=!files.length}});
$("export-all").addEventListener('click',async()=>{try{const ext=$("format").value;if(ext==='docx'){const parts=out.flatMap(o=>[{text:o.name,heading:true},{text:o.data}]);if($("single-export").checked||out.length===1)save('Easyconvert-merged.docx',await makeDocx(parts),'application/vnd.openxmlformats-officedocument.wordprocessingml.document');else for(const o of out)save(o.name.replace(/\.[^.]+$/i,'.docx'),await makeDocx([{text:o.name,heading:true},{text:o.data}]),DOCX)}else if($("single-export").checked)save(`Easyconvert-merged.${ext}`,out.map(o=>`# ${o.name}\n\n${o.data}`).join('\n\n'),'text/plain');else{if(typeof JSZip==='undefined')throw new Error('ZIP library failed to load');const z=new JSZip();out.forEach(o=>z.file(o.name,o.data));save('Easyconvert-bundle.zip',await z.generateAsync({type:'blob'}),'application/zip')}}catch(error){console.error('Export failed:',error);$("result-status").textContent=`Export failed: ${error.message}`}});render();
})();
</script>
</body>
</html>
