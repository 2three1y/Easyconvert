<!doctype html><html><head><meta charset="utf-8"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><h1>Easyconvert</h1><input id="input" type="file" multiple><select id="format"><option value="txt">TXT / Markdown</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option><option value="pdf">PDF</option><option value="json">JSON</option><option value="html">HTML</option></select><button id="convert">Convert</button><button id="download-all">Download all</button><div id="list">No files selected.</div><p id="status"></p><script>(()=>{let files=[],results=[],format='txt',esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const $=x=>document.getElementById(x),save=(n,d,t)=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1e3)};async function docx(text){let z=new JSZip(),body=text.split(/\r?\n/).map(x=>'<w:p><w:r><w:t xml:space="preserve">'+esc(x)+'</w:t></w:r></w:p>').join(''),xml='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr/></w:body></w:document>';if(!body||!xml.includes('<w:t'))throw Error('DOCX text generation failed');z.file('[Content_Types].xml','<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/_rels/document.xml.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>');z.file('word/document.xml',xml);return z.generateAsync({type:'blob'})}async function convert(f){let raw=await f.text();if(format==='docx')return{data:await docx(raw),type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',preview:raw};return{data:format==='json'?JSON.stringify({filename:f.name,content:raw},null,2):raw,type:'text/plain',preview:raw}}function render(){let l=$('list');l.replaceChildren();files.forEach((f,i)=>{let r=document.createElement('section'),b=document.createElement('button'),c=document.createElement('button'),d=document.createElement('button'),p=document.createElement('pre');b.textContent=f.name;b.onclick=()=>p.hidden=!p.hidden;c.textContent='Copy';c.onclick=()=>navigator.clipboard.writeText(results[i]?.preview||'');d.textContent='Download';d.onclick=()=>{let x=results[i];if(x)save(f.name.replace(/\.[^.]+$/,'')+'.'+(format==='docx'?'docx':format==='json'?'json':'txt'),x.data,x.type)};p.hidden=true;p.textContent=results[i]?.preview||'Not converted yet.';r.append(b,c,d,p);l.append(r)})}$('input').onchange=e=>{files.push(...e.target.files);render()};$('convert').onclick=async()=>{format=$('format').value;results=[];try{for(let f of files)results.push(await convert(f));render();$('status').textContent='Conversion complete as '+format.toUpperCase()}catch(e){$('status').textContent='Conversion failed: '+e.message}};$('download-all').onclick=async()=>{try{let z=new JSZip();results.forEach((x,i)=>z.file(files[i].name.replace(/\.[^.]+$/,'')+'.'+format,x.data));save('Easyconvert-converted-files.zip',await z.generateAsync({type:'blob'}),'application/zip')}catch(e){$('status').textContent='Download failed: '+e.message}};render()})()</script></body></html>
