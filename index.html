<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.6rem;margin:.25rem}.file{display:flex;gap:.5rem;margin:.3rem 0}.name{flex:1}</style></head><body><main><h1>Easyconvert</h1><input id="files" type="file" multiple><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p><select id="format"><option value="txt">TXT / Markdown</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><label><input id="single-export" type="checkbox"> Export as single file</label><button id="convert" type="button" disabled>Convert</button><section id="results-section" hidden><button id="export-all" type="button">Export all</button><button id="clear" type="button">Clear</button><p id="result-status" role="status" aria-live="polite"></p></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document',ZIP='application/zip';let files=[],out=[],busy=false;const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');function render(){if(busy)return;const l=$("file-list");l.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.className='file';const n=document.createElement('span');n.className='name';n.textContent=f.name;const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{files.splice(i,1);render()};li.append(n,b);l.append(li)});$("convert").disabled=!files.length;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} selected`:'No files selected'}function download(name,data,type){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.download=name;a.href=url;a.type=type;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}function fmt(n,t){if(/\.json$/i.test(n))try{return JSON.stringify(JSON.parse(t),null,2)}catch{}return t}async function read(f){if(!/\.zip$/i.test(f.name)&&!f.type.includes('zip'))return[{name:f.name,content:fmt(f.name,await f.text())}];const z=await JSZip.loadAsync(await f.arrayBuffer()),r=[];for(const [n,e]of Object.entries(z.files))if(!e.dir&&/\.(json|txt|md|csv)$/i.test(n))r.push({name:n,content:fmt(n,await e.async('string'))});return r}async function doc(t){const z=new JSZip(),body=String(t).split(/\r?\n/).map(x=>`<w:p>${/^#\s+/.test(x)?'<w:pPr><w:pStyle w:val="Heading1"/></w:pPr>':''}<w:r><w:t xml:space="preserve">${esc(x.replace(/^#\s+/, '')||' ')}</w:t></w:r></w:p>`).join('');z.file('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`);return z.generateAsync({type:'arraybuffer'})}$("files").onchange=e=>{if(busy)return;files.push(...Array.from(e.currentTarget.files||[]));render()};$("convert").onclick=async()=>{if(busy)return;busy=true;try{out=[];for(const f of files.slice())out.push(...await read(f));$("results-section").hidden=false;$("status").textContent='Conversion complete'}catch(e){$("status").textContent=`Conversion failed: ${e.message}`}finally{busy=false;render()}};$("export-all").onclick=async e=>{e.preventDefault();if(busy)return;busy=true;const snapshot=Object.freeze(out.map(x=>Object.freeze({name:x.name,content:x.content})));try{if($("single-export").checked&&$("format").value==='docx'){const text=snapshot.map(x=>`# ${x.name}\n\n${x.content}`).concat('# Thank you for using Easyconvert').join('\n\n');download('Easyconvert-merged.docx',await doc(text),DOCX)}else{const z=new JSZip();snapshot.forEach(x=>z.file(x.name,x.content));download('Easyconvert-bundle.zip',await z.generateAsync({type:'arraybuffer'}),ZIP)}$("result-status").textContent='Export complete'}catch(err){console.error(err);$("result-status").textContent=`Export failed: ${err.message}`}finally{busy=false;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} selected`:'No files selected';render()}};$("clear").onclick=()=>{if(busy)return;files.length=0;out.length=0;$("results-section").hidden=true;render()};render()})();</script></body></html>
