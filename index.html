<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.5rem;margin:.25rem}.file{border-top:1px solid #aaa;padding:.75rem}.content{white-space:pre-wrap;max-height:20rem;overflow:auto;background:#f5f5f5;padding:.5rem}.actions{display:inline-flex;gap:.25rem}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input id="input" type="file" multiple><select id="format" aria-label="Output format"><option value="txt">TXT / Markdown</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option><option value="pdf">PDF</option><option value="json">JSON</option><option value="html">HTML</option></select><button id="convert">Convert</button><button id="download-all">Download all</button><section><h2>File viewer</h2><div id="list" role="region">No files selected.</div></section><p id="status" role="status"></p><script>(()=>{const $=id=>document.getElementById(id);let files=[],results=[],format='txt';const mime={txt:'text/plain',md:'text/markdown',json:'application/json',html:'text/html',pdf:'application/pdf'};const save=(n,d,t)=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1e3)};const ext={txt:'txt',docx:'docx',zip:'zip',pdf:'pdf',json:'json',html:'html'};function pdf(s){return '%PDF-1.4\n'+s}async function docx(s){let z=new JSZip();z.file('word/document.xml','<document><body>'+s.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</body></document>');return z.generateAsync({type:'blob'})}async function convertOne(file,kind){let raw=await file.text();switch(kind){case'txt':return{data:raw,type:mime.txt};case'json':return{data:JSON.stringify({filename:file.name,content:raw},null,2),type:mime.json};case'html':return{data:`<!doctype html><article><h1>${file.name}</h1><pre>${raw.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre></article>`,type:mime.html};case'pdf':return{data:pdf(raw),type:mime.pdf};case'docx':return{data:await docx(raw),type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};case'zip':{let z=new JSZip();z.file(file.name,raw);return{data:await z.generateAsync({type:'blob'}),type:'application/zip'}}}}function render(){let l=$('list');l.replaceChildren();if(!files.length){l.textContent='No files selected.';return}files.forEach((f,i)=>{let r=document.createElement('section'),b=document.createElement('button'),c=document.createElement('button'),d=document.createElement('button'),p=document.createElement('pre');r.className='file';b.textContent=f.name;b.setAttribute('aria-expanded','false');b.onclick=()=>{p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))};c.textContent='Copy';c.setAttribute('aria-label','Copy '+f.name);c.onclick=()=>navigator.clipboard.writeText(results[i]?.text||'');d.textContent='Download';d.setAttribute('aria-label','Download '+f.name);d.onclick=()=>{let x=results[i];if(x)save(f.name.replace(/\.[^.]+$/,'')+'.'+ext[format],x.data,x.type)};p.className='content';p.hidden=true;p.textContent=results[i]?.text||'Not converted yet.';r.append(b,c,d,p);l.append(r)})}$('input').onchange=e=>{files.push(...e.target.files);render()};$('convert').onclick=async()=>{format=$('format').value;results=[];$('status').textContent='Converting as '+format.toUpperCase()+'…';try{for(let f of files){let x=await convertOne(f,format);results.push({...x,text:typeof x.data==='string'?x.data:'Binary '+format.toUpperCase()+' output'});await new Promise(requestAnimationFrame)}render();$('status').textContent='Conversion complete as '+format.toUpperCase()}catch(e){$('status').textContent='Conversion failed: '+e.message}};$('download-all').onclick=async()=>{try{if(!results.length)throw Error('Convert files first');let z=new JSZip();results.forEach((x,i)=>z.file(files[i].name.replace(/\.[^.]+$/,'')+'.'+ext[format],x.data));save('Easyconvert-converted-files.zip',await z.generateAsync({type:'blob'}),'application/zip')}catch(e){$('status').textContent='Download failed: '+e.message}};render()})()</script></body></html>
