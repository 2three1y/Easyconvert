<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><title>EasyConvert — Offline File Converter</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem;background:#eef2f5;color:#17202a}header{background:#102a43;color:#fff;padding:2rem;border-radius:10px}section{background:#fff;padding:1rem;margin:1rem 0;border:1px solid #b8c5cf;border-radius:10px}button,select,input{font:inherit;padding:.65rem;margin:.25rem;border:2px solid #075985;border-radius:6px}button{background:#075985;color:#fff;font-weight:bold}button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #f59e0b}ul{padding:0;list-style:none}.result{border:1px solid #b8c5cf;padding:.5rem}pre{white-space:pre-wrap;max-height:25rem;overflow:auto;background:#f4f6f8;padding:1rem}</style></head><body><header role="banner"><h1>EasyConvert</h1><p>Accessible, private, offline file conversion.</p></header><main><section aria-labelledby="upload"><h2 id="upload">Add files</h2><input id="files" type="file" multiple accept=".json,.csv,.txt,.zip" aria-label="Choose files to convert"><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section><section aria-labelledby="format-heading"><h2 id="format-heading">Convert to</h2><label for="format">Format</label><select id="format" aria-label="Choose output format"><option value="txt">Clean Text / Markdown</option><option value="html">HTML</option><option value="json">JSON formatted</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label for="single-export"><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" disabled>Convert file</button></section><section id="results-section" hidden aria-labelledby="results-heading"><h2 id="results-heading">Converted results</h2><ul id="results"></ul><section id="batch-actions" hidden aria-labelledby="batch-heading"><h2 id="batch-heading">Batch actions</h2><button id="copy-all" type="button">Copy all</button><button id="export-all" type="button">Export all</button></section><p id="result-status" role="status" aria-live="polite"></p></section></main><script>(()=>{const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';let files=[],out=[];const thank='Thank you for using EasyConvert!\n\nYour data stayed 100% private, local, and offline.\n';const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');function makeDocx(parts){const body=parts.map(p=>`<w:p><w:pPr><w:pStyle w:val="${p.heading?'Heading1':'Normal'}"/></w:pPr><w:r><w:t xml:space="preserve">${esc(p.text)}</w:t></w:r></w:p>`).join('');const z=new JSZip;z.file('[Content_Types].xml','<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<?xml version="1.0"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`);return z.generateAsync({type:'blob'})}function save(name,data,type='application/octet-stream'){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(new Blob([data],{type}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){const u=$("file-list");u.replaceChildren();files.forEach((f,i)=>{const l=document.createElement('li'),b=document.createElement('button');l.append(document.createTextNode(f.name+' '));b.textContent='Remove';b.setAttribute('aria-label','Remove '+f.name);b.onclick=()=>{files.splice(i,1);render()};l.append(b);u.append(l)});$("batch-options").hidden=files.length<2;$("convert").disabled=!files.length;$("status").textContent=files.length?files.length+' file'+(files.length===1?'':'s')+' uploaded':'No files selected'}$("files").onchange=e=>{files.push(...e.target.files);render();e.target.value=''};$("convert").onclick=async()=>{out=[];const ext=$("format").value;for(const f of files){let t=await f.text();if(ext==='json')try{t=JSON.stringify(JSON.parse(t),null,2)}catch{}const base=f.name.replace(/\.[^.]+$/,'');out.push({name:base+'.'+ext,data:t})}const u=$("results");u.replaceChildren();out.forEach(o=>{const l=document.createElement('li');l.className='result';l.textContent=o.name;u.append(l)});$("results-section").hidden=false;$("batch-actions").hidden=out.length<2;$("result-status").textContent=out.length+' file'+(out.length===1?'':'s')+' ready.'};$("copy-all").onclick=()=>navigator.clipboard?.writeText(out.map(o=>`[${o.name}] text:\n\n${o.data}`).join('\n\n---\n\n'));$("export-all").onclick=async()=>{const format=$("format").value;if(format==='docx'){if($("single-export").checked||out.length===1){const parts=[];out.forEach(o=>{parts.push({text:o.name,heading:true});parts.push({text:o.data})});parts.push({text:'Thank You',heading:true});parts.push({text:thank});save('EasyConvert-merged.docx',await makeDocx(parts),DOCX);return}for(const o of out)save(o.name.replace(/\.[^.]+$/i,'.docx'),await makeDocx([{text:o.name,heading:true},{text:o.data}]),DOCX);return}if($("single-export").checked){save('EasyConvert-merged.txt',out.map(o=>`# ${o.name}\n\n${o.data}`).join('\n\n')+'\n# Thank You\n\n'+thank,'text/plain');return}const z=new JSZip;out.forEach(o=>z.file('Converted/'+o.name,o.data));files.forEach(f=>z.file('Originals/'+f.name,f));z.file('THANK_YOU.txt',thank);z.generateAsync({type:'blob'}).then(b=>save('EasyConvert-bundle.zip',b,'application/zip'))}})();</script></body></html>
