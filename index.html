<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,input,select{font:inherit;padding:.5rem;margin:.25rem}.file{border-top:1px solid #aaa;padding:.75rem 0}.content{white-space:pre-wrap;max-height:20rem;overflow:auto;background:#f5f5f5;padding:.5rem}.actions{display:inline-flex;gap:.25rem}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input id="input" type="file" multiple><select id="format" aria-label="Output format"><optgroup label="Documents"><option>TXT / Markdown</option><option>DOCX</option><option>PDF</option><option>HTML</option></optgroup><optgroup label="Data"><option>JSON</option><option>CSV</option></optgroup><optgroup label="Archives"><option>ZIP archive</option></optgroup></select><button id="convert">Convert</button><section aria-labelledby="viewer-title"><h2 id="viewer-title">File viewer</h2><button id="toggle" aria-expanded="true" aria-controls="file-list">Collapse viewer</button><button id="copy-all" aria-label="Copy all files">Copy all</button><button id="download-all" aria-label="Download all files">Download all</button><div id="file-list" role="region" tabindex="-1">No files selected.</div></section><p id="status" role="status" aria-live="polite">No files selected.</p><script>(()=>{'use strict';const $=id=>document.getElementById(id);let files=[],results=[],busy=false;const setStatus=text=>{$('status').textContent=text};const save=(name,text)=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};function render(){const list=$('file-list');list.replaceChildren();if(!files.length){list.textContent='No files selected.';return}files.forEach((file,index)=>{const region=document.createElement('section');region.className='file';region.setAttribute('aria-labelledby','file-button-'+index);const bar=document.createElement('div'),nameButton=document.createElement('button');nameButton.id='file-button-'+index;nameButton.type='button';nameButton.textContent=file.name;nameButton.setAttribute('aria-expanded','false');nameButton.setAttribute('aria-controls','file-content-'+index);const actions=document.createElement('span');actions.className='actions';actions.setAttribute('aria-label','File actions: Copy and Download');const copy=document.createElement('button');copy.type='button';copy.textContent='Copy';copy.setAttribute('aria-label','Copy '+file.name);copy.onclick=()=>navigator.clipboard.writeText(results[index]?.content||'').then(()=>setStatus('Copied '+file.name));const download=document.createElement('button');download.type='button';download.textContent='Download';download.setAttribute('aria-label','Download '+file.name);download.onclick=()=>save(file.name,results[index]?.content||'');actions.append(copy,download);bar.append(nameButton,actions);const content=document.createElement('pre');content.id='file-content-'+index;content.className='content';content.hidden=true;content.tabIndex=0;content.setAttribute('aria-label',file.name+' contents');content.textContent=results[index]?.content||'Not converted yet.';nameButton.onclick=()=>{const expanded=nameButton.getAttribute('aria-expanded')==='true';nameButton.setAttribute('aria-expanded',String(!expanded));content.hidden=expanded;if(!expanded)content.focus()};region.append(bar,content);list.append(region)})}$('input').onchange=event=>{files.push(...event.target.files);render();setStatus(`${files.length} file(s) selected`)};$('toggle').onclick=()=>{const list=$('file-list'),expanded=$('toggle').getAttribute('aria-expanded')==='true';$('toggle').setAttribute('aria-expanded',String(!expanded));$('toggle').textContent=expanded?'Expand viewer':'Collapse viewer';list.hidden=expanded;if(!expanded)list.focus()};$('convert').onclick=async()=>{if(busy||!files.length)return;busy=true;results=[];setStatus('Converting…');try{for(const file of files){if(file.size>25*1024*1024)throw Error(file.name+' exceeds the 25 MB safety limit');results.push({name:file.name,content:await file.text()});await new Promise(requestAnimationFrame)}render();setStatus('Conversion complete.')}catch(error){results=[];render();setStatus('Conversion failed safely: '+error.message)}finally{busy=false}};$('copy-all').onclick=()=>navigator.clipboard.writeText(results.map(item=>item.content).join('\n\n')).then(()=>setStatus('Copied all files'));$('download-all').onclick=()=>results.forEach(item=>save(item.name,item.content));render()})();</script></body></html>
