<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><title>EasyConvert — Offline File Converter</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem;background:#eef2f5;color:#17202a}header{background:#102a43;color:#fff;padding:2rem;border-radius:10px}section{background:#fff;padding:1rem;margin:1rem 0;border:1px solid #b8c5cf;border-radius:10px}button,select,input{font:inherit;padding:.65rem;margin:.25rem;border:2px solid #075985;border-radius:6px}button{background:#075985;color:#fff;font-weight:bold}button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #f59e0b}ul{padding:0;list-style:none}.result{border:1px solid #b8c5cf}.toggle{width:100%;text-align:left;background:#fff;color:#17202a}.body{padding:1rem;border-top:1px solid #b8c5cf}pre{white-space:pre-wrap;max-height:25rem;overflow:auto;background:#f4f6f8;padding:1rem}</style></head><body><header role="banner"><h1>EasyConvert</h1><p>Accessible, private, offline file conversion.</p></header><main role="main"><section aria-labelledby="upload"><h2 id="upload">Add files</h2><input id="files" type="file" multiple accept=".json,.csv,.txt,.zip,application/zip,application/x-zip-compressed" aria-label="Choose files to convert"><ul id="file-list" role="list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section><section aria-labelledby="format-heading"><h2 id="format-heading">Convert to</h2><label for="format">Format</label><select id="format" aria-label="Choose output format"><option value="txt">Clean Text / Markdown</option><option value="html">HTML</option><option value="json">JSON formatted</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label for="single-export"><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" disabled>Convert file</button></section><section id="results-section" hidden aria-labelledby="results-heading"><h2 id="results-heading">Converted results</h2><ul id="results" role="list"></ul><section id="batch-actions" hidden aria-labelledby="batch-heading"><h2 id="batch-heading">Batch actions</h2><button id="copy-all" type="button">Copy all</button><button id="export-all" type="button">Export all</button></section><p id="result-status" role="status" aria-live="polite"></p></section></main><script>(()=>{const $=id=>document.getElementById(id);let files=[],out=[];const thank='Thank you for using EasyConvert!\n\nYour data stayed 100% private, local, and offline.\n';const heading=n=>`# ${n}\n\n`;function render(){const u=$("file-list");u.replaceChildren();files.forEach((f,i)=>{const l=document.createElement("li"),b=document.createElement("button");l.append(document.createTextNode(f.name+" "));b.textContent="Remove";b.setAttribute("aria-label","Remove "+f.name);b.onclick=()=>{files.splice(i,1);render()};l.append(b);u.append(l)});$("batch-options").hidden=files.length<2;$("convert").disabled=!files.length;$("convert").textContent=files.length>1?"Convert files":"Convert file"}$("files").onchange=async e=>{for(const f of e.target.files){if(/\.zip$/i.test(f.name)){try{const z=await JSZip.loadAsync(f);for(const[n,x]of Object.entries(z.files))if(!x.dir&&/\.(json|csv|txt)$/i.test(n))files.push(new File([await x.async("blob")],n))}catch{$("status").textContent="ZIP could not be opened."}}else files.push(f)}render();$("status").textContent=files.length+" file"+(files.length===1?"":"s")+" uploaded";e.target.value=""};function save(n,d,type="text/plain"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([d],{type}));a.download=n;a.click()}function show(){const u=$("results");u.replaceChildren();out.forEach((o,i)=>{const l=document.createElement("li"),b=document.createElement("button"),d=document.createElement("div"),h=document.createElement("h3"),c=document.createElement("button"),x=document.createElement("button"),p=document.createElement("pre");l.className="result";b.className="toggle";b.textContent=o.name;b.setAttribute("aria-expanded","false");b.setAttribute("aria-controls","content-"+i);d.id="content-"+i;d.className="body";d.hidden=true;h.textContent="File actions";c.textContent="Copy text";c.setAttribute("aria-label","Copy text from "+o.name);x.textContent="Download file";x.setAttribute("aria-label","Download "+o.name);p.textContent=o.data;c.onclick=()=>navigator.clipboard?.writeText(`[${o.name}] text:\n\n`+o.data);x.onclick=()=>save(o.name,o.data);d.append(h,c,x,p);b.onclick=()=>{const open=b.getAttribute("aria-expanded")==="true";b.setAttribute("aria-expanded",String(!open));d.hidden=open};l.append(b,d);u.append(l)});$("results-section").hidden=false;$("batch-actions").hidden=out.length<2}$("convert").onclick=async()=>{out=[];const ext=$("format").value;for(const f of files){let t=await f.text();if(ext==="json")try{t=JSON.stringify(JSON.parse(t),null,2)}catch{}out.push({name:files.length===1?f.name:f.name.replace(/\.[^.]+$/,".")+ext,data:t})}show();$("result-status").textContent=out.length+" file"+(out.length===1?"":"s")+" ready."};$("copy-all").onclick=()=>navigator.clipboard?.writeText(out.map(o=>`[${o.name}] text:\n\n`+o.data).join("\n\n---\n\n"));$("export-all").onclick=()=>{if($("single-export").checked){save("EasyConvert-merged.txt",out.map(o=>heading(o.name)+o.data).join("\n\n")+"\n# Thank You\n\n"+thank);return}const z=new JSZip;out.forEach(o=>z.file("Converted/"+o.name,o.data));files.forEach(f=>z.file("Originals/"+f.name,f));z.file("THANK_YOU.txt",thank);z.generateAsync({type:"blob"}).then(b=>save("EasyConvert-bundle.zip",b,"application/zip"))}})();</script></body></html>
