<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.5rem;margin:.25rem}.viewer{border:1px solid #aaa;padding:1rem}.file{border-top:1px solid #ccc;padding:.75rem 0}.filehead{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.content{white-space:pre-wrap;background:#f5f5f5;padding:.75rem;overflow:auto}.collapsed .content{display:none}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input id="fileInput" type="file" multiple><select id="format" aria-label="Output format"><optgroup label="Documents"><option value="txt">TXT / Markdown</option><option value="docx">DOCX</option><option value="pdf">PDF</option><option value="html">HTML</option></optgroup><optgroup label="Data"><option value="json">JSON</option><option value="csv">CSV</option></optgroup><optgroup label="Archives"><option value="zip">ZIP archive</option></optgroup></select><label><input id="singleFile" type="checkbox"> Single file</label><label><input id="stripImages" type="checkbox"> Strip images for PDF/DOCX</label><button id="convert">Convert</button><section class="viewer" aria-labelledby="viewer-title"><div class="filehead"><h2 id="viewer-title">File viewer</h2><button id="toggle" aria-expanded="true" aria-controls="file-list">Collapse viewer</button><button id="copyAll" aria-label="Copy all file contents">Copy all</button><button id="downloadAll" aria-label="Download all files">Download all</button></div><div id="file-list" role="region" aria-live="polite" tabindex="-1">No files selected.</div></section><p id="status" class="status" role="status" aria-live="polite">No files selected.</p><script>(()=>{const $=id=>document.getElementById(id);let files=[],out=[];const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const dl=(n,d,t='text/plain')=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};function render(){let l=$('file-list');l.replaceChildren();if(!files.length){l.textContent='No files selected.';return}files.forEach((f,i)=>{let row=document.createElement('article');row.className='file';row.setAttribute('aria-labelledby','file-name-'+i);let h=document.createElement('div');h.className='filehead';let name=document.createElement('h3');name.id='file-name-'+i;name.textContent=f.name;let copy=document.createElement('button');copy.textContent='Copy';copy.setAttribute('aria-label','Copy '+f.name);copy.onclick=()=>navigator.clipboard.writeText(out[i]?.content||'').then(()=>$('status').textContent='Copied '+f.name);let down=document.createElement('button');down.textContent='Download';down.setAttribute('aria-label','Download '+f.name);down.onclick=()=>dl(f.name,out[i]?.content||'');let tog=document.createElement('button');tog.textContent='Collapse';tog.setAttribute('aria-expanded','true');tog.setAttribute('aria-controls','file-content-'+i);tog.setAttribute('aria-label','Expand or collapse '+f.name);tog.onclick=()=>{let c=$('file-content-'+i),open=tog.getAttribute('aria-expanded')==='true';c.hidden=open;tog.setAttribute('aria-expanded',String(!open));tog.textContent=open?'Expand':'Collapse'};h.append(name,copy,down,tog);let c=document.createElement('pre');c.id='file-content-'+i;c.className='content';c.textContent=out[i]?.content||'Not converted yet.';c.tabIndex=0;c.setAttribute('aria-label',f.name+' content');row.append(h,c);l.append(row)})}$('fileInput').onchange=e=>{files.push(...e.target.files);render();$('status').textContent=`${files.length} file(s) selected`};$('toggle').onclick=()=>{let l=$('file-list'),open=$('toggle').getAttribute('aria-expanded')==='true';l.hidden=open;$('toggle').setAttribute('aria-expanded',String(!open));$('toggle').textContent=open?'Expand viewer':'Collapse viewer';if(!open)l.focus()};$('convert').onclick=async()=>{out=[];for(let f of files)out.push({name:f.name,content:await f.text()});render();$('status').textContent='Conversion complete.'};$('copyAll').onclick=()=>navigator.clipboard.writeText(out.map(x=>x.content).join('\n\n')).then(()=>$('status').textContent='Copied all file contents');$('downloadAll').onclick=()=>out.forEach(x=>dl(x.name,x.content));render()})()</script></body></html>
