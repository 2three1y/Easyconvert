<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.5rem;margin:.25rem}.file{border-top:1px solid #aaa;padding:.75rem}.content{white-space:pre-wrap;max-height:20rem;overflow:auto;background:#f5f5f5;padding:.5rem}.actions{display:inline-flex;gap:.25rem}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input id="input" type="file" multiple><select id="format" aria-label="Output format"><option value="txt">TXT / Markdown</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option><option value="pdf">PDF</option><option value="json">JSON</option><option value="html">HTML</option></select><button id="convert">Convert</button><button id="download-all">Download all</button><section><h2>File viewer</h2><div id="list" role="region">No files selected.</div></section><p id="status" role="status"></p><script>(()=>{const $=id=>document.getElementById(id);let files=[],results=[],format='txt';const ext={txt:'txt',docx:'docx',zip:'zip',pdf:'pdf',json:'json',html:'html'},esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const save=(n,d,t)=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1e3)};function makePdf(text){let body=text.split(/\r?\n/).map(x=>`BT /F1 11 Tf 72 760 Td (${x.replace(/[()\\]/g,'\\$&')}) Tj ET`).join('\n'),objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>','<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'],pdf='%PDF-1.4\n',offs=[0];objs.forEach((o,i)=>{offs[i+1]=pdf.length;pdf+=(i+1)+' 0 obj\n'+o+'\nendobj\n'});let x=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<offs.length;i++)pdf+=String(offs[i]).padStart(10,'0')+' 00000 n \n';pdf+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';return new Blob([pdf],{type:'application/pdf'})}async function makeDocx(text){let z=new JSZip();z.file('[Content_Types].xml','<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/_rels/document.xml.rels','<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');z.file('word/document.xml','<?xml version="1.0"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t xml:space="preserve">'+esc(text)+'</w:t></w:r></w:p><w:sectPr/></w:body></w:document>');return z.generateAsync({type:'blob'})}async function convertOne(f,k){let raw=await f.text();if(k==='txt')return{data:raw,type:'text/plain',preview:raw};if(k==='json')return{data:JSON.stringify({filename:f.name,content:raw},null,2),type:'application/json',preview:raw};if(k==='html')return{data:'<!doctype html><article><pre>'+esc(raw)+'</pre></article>',type:'text/html',preview:raw};if(k==='pdf')return{data:makePdf(raw),type:'application/pdf',preview:raw};if(k==='docx')return{data:await makeDocx(raw),type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',preview:raw};if(k==='zip'){let z=new JSZip();z.file(f.name,raw);return{data:await z.generateAsync({type:'blob'}),type:'application/zip',preview:raw}}}function render(){let l=$('list');l.replaceChildren();if(!files.length){l.textContent='No files selected.';return}files.forEach((f,i)=>{let r=document.createElement('section'),b=document.createElement('button'),c=document.createElement('button'),d=document.createElement('button'),p=document.createElement('pre');r.className='file';b.textContent=f.name;b.setAttribute('aria-expanded','false');b.onclick=()=>{p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))};c.textContent='Copy';c.onclick=()=>navigator.clipboard.writeText(results[i]?.preview||'');d.textContent='Download';d.onclick=()=>{let x=results[i];if(x)save(f.name.replace(/\.[^.]+$/,'')+'.'+ext[format],x.data,x.type)};p.className='content';p.hidden=true;p.textContent=results[i]?.preview||'Not converted yet.';r.append(b,c,d,p);l.append(r)})}$('input').onchange=e=>{files.push(...e.target.files);render()};$('convert').onclick=async()=>{format=$('format').value;results=[];$('status').textContent='Converting…';try{for(let f of files)results.push(await convertOne(f,format));render();$('status').textContent='Conversion complete as '+format.toUpperCase()}catch(e){$('status').textContent='Conversion failed: '+e.message}};$('download-all').onclick=async()=>{try{if(!results.length)throw Error('Convert files first');let z=new JSZip();results.forEach((x,i)=>z.file(files[i].name.replace(/\.[^.]+$/,'')+'.'+ext[format],x.data));save('Easyconvert-converted-files.zip',await z.generateAsync({type:'blob'}),'application/zip')}catch(e){$('status').textContent='Download failed: '+e.message}};render()})()</script></body></html>
