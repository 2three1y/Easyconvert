<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,input,select{font:inherit;padding:.5rem;margin:.25rem}.file{border-top:1px solid #aaa;padding:.75rem}.content{white-space:pre-wrap;max-height:20rem;overflow:auto;background:#f5f5f5;padding:.5rem}.actions{display:inline-flex;gap:.25rem}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input id="input" type="file" multiple><select id="format" aria-label="Output format"><option value="txt">TXT / Markdown</option><option value="json">JSON</option><option value="csv">CSV</option><option value="html">HTML</option><option value="zip">ZIP archive</option></select><button id="convert" type="button">Convert</button><button id="download-all" type="button">Download all</button><section aria-labelledby="viewer-title"><h2 id="viewer-title">File viewer</h2><button id="toggle" type="button" aria-expanded="true" aria-controls="file-list">Collapse viewer</button><div id="file-list" role="region" tabindex="-1">No files selected.</div></section><p id="status" role="status" aria-live="polite">No files selected.</p><script>(()=>{'use strict';const $=id=>document.getElementById(id);let files=[],results=[],busy=false;const setStatus=t=>{$('status').textContent=t};const save=(name,data,type='text/plain')=>{const a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};function render(){const list=$('file-list');list.replaceChildren();if(!files.length){list.textContent='No files selected.';return}files.forEach((file,i)=>{const region=document.createElement('section');region.className='file';const bar=document.createElement('div'),button=document.createElement('button');button.type='button';button.textContent=file.name;button.setAttribute('aria-expanded','false');button.setAttribute('aria-controls','content-'+i);const actions=document.createElement('span');actions.className='actions';actions.setAttribute('aria-label','File actions: Copy and Download');const copy=document.createElement('button');copy.type='button';copy.textContent='Copy';copy.setAttribute('aria-label','Copy '+file.name);copy.onclick=()=>navigator.clipboard.writeText(results[i]?.content||'').then(()=>setStatus('Copied '+file.name)).catch(e=>setStatus('Copy failed: '+e.message));const down=document.createElement('button');down.type='button';down.textContent='Download';down.setAttribute('aria-label','Download '+file.name);down.onclick=()=>save(file.name,results[i]?.content||'');actions.append(copy,down);bar.append(button,actions);const content=document.createElement('pre');content.id='content-'+i;content.className='content';content.hidden=true;content.textContent=results[i]?.content||'Not converted yet.';button.onclick=()=>{const open=button.getAttribute('aria-expanded')==='true';button.setAttribute('aria-expanded',String(!open));content.hidden=open;if(!open)content.focus()};region.append(bar,content);list.append(region)})}async function convert(){if(busy||!files.length)return;busy=true;setStatus('Converting…');try{results=[];const format=$('format').value;for(const file of files){const raw=await file.text();let content=raw;if(format==='json')content=JSON.stringify({filename:file.name,content:raw},null,2);if(format==='html')content=`<article><h1>${file.name}</h1><pre>${raw.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre></article>`;if(format==='csv')content=`filename,content\n"${file.name.replace(/"/g,'""')}","${raw.replace(/"/g,'""')}"`;results.push({name:file.name,content});await new Promise(resolve=>requestAnimationFrame(resolve))}render();setStatus('Conversion complete as '+format.toUpperCase()+'.')}catch(e){setStatus('Conversion failed safely: '+(e.message||e))}finally{busy=false}}$('input').onchange=e=>{try{files.push(...Array.from(e.target.files||[]));render();setStatus(`${files.length} file(s) selected`)}catch(err){setStatus('File selection failed: '+err.message)}};$('convert').onclick=e=>{e.preventDefault();convert().catch(err=>setStatus('Conversion failed safely: '+err.message))};$('download-all').onclick=async()=>{try{if(!results.length){setStatus('Convert files before downloading.');return}const z=new JSZip();results.forEach(x=>z.file(x.name,x.content));save('Easyconvert-converted-files.zip',await z.generateAsync({type:'blob'}),'application/zip');setStatus('Downloaded converted files.')}catch(e){setStatus('Download all failed: '+e.message)}};$('toggle').onclick=()=>{const list=$('file-list'),b=$('toggle'),open=b.getAttribute('aria-expanded')==='true';list.hidden=open;b.setAttribute('aria-expanded',String(!open));b.textContent=open?'Expand viewer':'Collapse viewer';if(!open)list.focus()};window.addEventListener('error',e=>setStatus('Unexpected error: '+e.message));render()})();</script></body></html>
