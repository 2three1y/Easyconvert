<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Easyconvert</title>
</head>
<body>
    <h1>Easyconvert</h1>
    <input type="file" id="fileInput" multiple>
    <div id="file-list">No files selected.</div>
    <label>Output format</label>
    <select id="format">
        <option>TXT / Markdown</option>
        <option>DOCX</option>
        <option>ZIP archive</option>
    </select>
    <label><input type="checkbox" id="singleFile"> Export as single merged file (when possible)</label>
    <button type="button" id="convert">Convert</button>
    <button type="button" id="export">Export</button>
    <button type="button" id="clear">Clear all</button>
</body>
</html>
