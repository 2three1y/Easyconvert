<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><main><h1>Easyconvert</h1><input id="files" type="file" multiple><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p><select id="format"><option value="txt">TXT / Markdown</option><option value="html">HTML</option><option value="json">Formatted JSON</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" type="button" disabled>Convert</button><section id="results-section" hidden><ul id="results"></ul><button id="export-all" type="button">Export all</button><button id="clear" type="button">Clear</button><p id="result-status" role="status" aria-live="polite"></p></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';let files=[],out=[];const xml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&apos;');function save(n,d,t){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function render(){const l=$("file-list");l.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.textContent=f.name+' ';const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{files.splice(i,1);render()};li.append(b);l.append(li)});$("batch-options").hidden=files.length<2;$("convert").disabled=!files.length;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} selected`:'No files selected'}function fmt(n,t){if(/\.json$/i.test(n))try{return JSON.stringify(JSON.parse(t),null,2)}catch{}return t}async function read(f){if(!/\.zip$/i.test(f.name)&&!f.type.includes('zip'))return[{name:f.name,content:fmt(f.name,await f.text())}];const z=await JSZip.loadAsync(await f.arrayBuffer()),r=[];for(const [n,e] of Object.entries(z.files))if(!e.dir&&/\.(json|txt|md|csv)$/i.test(n))r.push({name:n,content:fmt(n,await e.async('string'))});return r}async function doc(t){const z=new JSZip(),b=String(t).split(/\r?\n/).map(x=>`<w:p>${/^#\s+/.test(x)?'<w:pPr><w:pStyle w:val="Heading1"/></w:pPr>':''}<w:r><w:t xml:space="preserve">${xml(x.replace(/^#\s+/, '')||' ')}</w:t></w:r></w:p>`).join('');z.file('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${b}<w:sectPr/></w:body></w:document>`);return z.generateAsync({type:'blob',mimeType:DOCX})}$("files").onchange=e=>{const p=Array.from(e.currentTarget.files||[]);if(p.length){files=files.concat(p);render()}e.currentTarget.value=''};$("convert").onclick=async()=>{const b=$("convert");b.disabled=true;try{out=[];for(const f of files)out.push(...await read(f));$("results-section").hidden=false;$("result-status").textContent=`${out.length} file${out.length===1?'':'s'} ready`;$("status").textContent='Conversion complete'}catch(e){$("status").textContent=`Conversion failed: ${e.message}`}finally{b.disabled=!files.length}};$("export-all").onclick=async e=>{e.preventDefault();e.stopPropagation();try{const current=out.slice(),ext=$("format").value;if($("single-export").checked){const t=current.map(o=>`# ${o.name}\n\n${o.content}`).join('\n\n');if(ext==='docx')save('Easyconvert-merged.docx',await doc(t),DOCX);else save(`Easyconvert-merged.${ext}`,t,'text/plain')}else{const z=new JSZip();current.forEach(o=>z.file(o.name,o.content));save('Easyconvert-bundle.zip',await z.generateAsync({type:'blob'}),'application/zip')}$("result-status").textContent='Export complete'}catch(e){$("result-status").textContent=`Export failed: ${e.message}`}};$("clear").onclick=()=>{files=[];out=[];$("results-section").hidden=true;$("files").value='';render()};render()})();</script></body></html>
