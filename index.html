<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.5rem;margin:.25rem}li{margin:.35rem 0}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input type="file" id="fileInput" multiple><div id="file-list">No files selected.</div><label for="format">Output format</label><select id="format"><option value="txt">TXT / Markdown</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option><option value="pdf">PDF</option><option value="json">JSON</option><option value="html">HTML</option></select><label><input type="checkbox" id="singleFile"> Export as single merged file (when possible)</label><button type="button" id="convert">Convert</button><button type="button" id="export" disabled>Export</button><button type="button" id="clear">Clear all</button><p id="status" class="status" role="status" aria-live="polite">No files selected.</p><script>(()=>{'use strict';const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document',MIME={txt:'text/plain',json:'application/json',html:'text/html',pdf:'application/pdf'};let files=Object.freeze([]),output=Object.freeze([]),busy=false;const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');function render(){if(busy)return;const list=$("file-list");list.replaceChildren();if(!files.length)list.textContent='No files selected.';else{const ul=document.createElement('ul');files.forEach((f,i)=>{const li=document.createElement('li');li.append(document.createTextNode(f.name+' '));const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{if(!busy){files=Object.freeze(files.filter((_,n)=>n!==i));render()}};li.append(b);ul.append(li)});list.append(ul)}$("export").disabled=!output.length;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} selected`:'No files selected.'}async function read(f){let c=await f.text();if(/\.json$/i.test(f.name))try{c=JSON.stringify(JSON.parse(c),null,2)}catch{}return{name:f.name,content:c}}function pdf(text){const clean=text.replace(/[()\\]/g,' ').replace(/\r?\n/g,' '),stream=`BT /F1 12 Tf 50 760 Td (${clean.slice(0,3000)}) Tj ET`,objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>',`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`,'','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>'];let s='%PDF-1.4\n',offs=[];objs.forEach((o,i)=>{offs[i]=s.length;s+=`${i+1} 0 obj\n${o}\nendobj\n`});const x=s.length;s+=`xref\n0 ${objs.length}\n0000000000 65535 f \n${offs.map(o=>String(o).padStart(10,'0')+' 00000 n ').join('\n')}\ntrailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;return s}function download(name,data,type){const blob=data instanceof Blob?data:new Blob([data],{type}),file=new File([blob],name,{type});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(e=>{if(e.name!=='AbortError')fallback()});return}fallback();function fallback(){const u=URL.createObjectURL(blob),frame=document.createElement('iframe');frame.setAttribute('aria-hidden','true');frame.tabIndex=-1;Object.assign(frame.style,{position:'fixed',width:'1px',height:'1px',border:'0',opacity:'0',pointerEvents:'none',left:'-9999px'});frame.src=u;document.body.append(frame);setTimeout(()=>{frame.remove();URL.revokeObjectURL(u)},30000)}}async function docx(t){const z=new JSZip(),body=`<w:p><w:r><w:t>${esc(t)}</w:t></w:r></w:p>`;z.file('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`);return z.generateAsync({type:'arraybuffer'})}$("fileInput").onchange=e=>{if(!busy){files=Object.freeze(files.concat(Array.from(e.target.files||[])));render()}};$("convert").onclick=async e=>{e.preventDefault();if(busy||!files.length)return;busy=true;try{const r=[];for(const f of files.slice())r.push(await read(f));output=Object.freeze(r.map(x=>Object.freeze(x)));$("status").textContent='Conversion complete.'}catch(err){$("status").textContent=`Conversion failed: ${err.message}`}finally{busy=false;render()}};$("export").onclick=async e=>{e.preventDefault();if(busy||!output.length)return;busy=true;const snap=Object.freeze(output.map(x=>Object.freeze({name:x.name,content:x.content})));try{const fmt=$("format").value,merged=snap.map(x=>`# ${x.name}\n\n${x.content}`).join('\n\n'),single=$("singleFile").checked;if(fmt==='zip'||!single){const z=new JSZip();snap.forEach(x=>z.file(x.name,x.content));download('Easyconvert-bundle.zip',await z.generateAsync({type:'arraybuffer'}),'application/zip')}else if(fmt==='docx')download('Easyconvert-merged.docx',await docx(merged),DOCX);else if(fmt==='pdf')download('Easyconvert-merged.pdf',pdf(merged),MIME.pdf);else if(fmt==='json')download('Easyconvert-merged.json',JSON.stringify(snap.map(x=>({name:x.name,content:x.content})),null,2),MIME.json);else if(fmt==='html')download('Easyconvert-merged.html',`<!doctype html><html><body>${snap.map(x=>`<h1>${esc(x.name)}</h1><pre>${esc(x.content)}</pre>`).join('')}<footer>Thank you for using Easyconvert</footer></body></html>`,MIME.html);else download('Easyconvert-merged.txt',merged+'\n\nThank you for using Easyconvert','text/plain');$("status").textContent='Export complete.'}catch(err){console.error(err);$("status").textContent='Export failed; files preserved.'}finally{busy=false;render()}};$("clear").onclick=()=>{if(!busy){files=Object.freeze([]);output=Object.freeze([]);render()}};render()})()</script></body></html>
