<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<title>Easyconvert</title>
<style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.6rem;margin:.25rem}button{background:#075985;color:white}.viewer{border:1px solid #b8c5cf;margin:.5rem 0}.viewer-toggle{width:100%;text-align:left;background:#fff;color:#17202a}.viewer-body{padding:1rem;border-top:1px solid #b8c5cf}pre{white-space:pre-wrap;max-height:20rem;overflow:auto}</style>
</head>
<body>
<header><h1>Easyconvert</h1></header>
<main>
<section><h2>Add files</h2><input id="files" type="file" multiple accept="*/*,.txt,.csv,.json,.zip,application/zip,application/x-zip-compressed" aria-label="Choose files to convert"><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section>
<section><label for="format">Format</label><select id="format"><option value="txt">TXT / Markdown</option><option value="html">HTML</option><option value="json">Formatted JSON</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label for="single-export"><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" type="button" disabled>Convert</button></section>
<section id="results-section" hidden aria-labelledby="results-heading"><h2 id="results-heading">Results</h2><ul id="results"></ul><button id="export-all" type="button" hidden>Export all</button><p id="result-status" role="status" aria-live="polite"></p></section>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id), DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
let files=[],out=[];
const thank='Thank you for using Easyconvert!';
const xml=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
function save(name,data,type='application/octet-stream'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.href=url;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function paragraph(text,heading=false){return `<w:p>${heading?'<w:pPr><w:pStyle w:val="Heading1"/></w:pPr>':''}<w:r><w:t xml:space="preserve">${xml(text||' ')}</w:t></w:r></w:p>`}
async function makeDocx(parts){
 const body=parts.map(p=>paragraph(p.text,p.heading)).join(''), z=new JSZip();
 z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>');
 z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
 z.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr></w:body></w:document>`);
 z.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');
 z.file('word/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:sz w:val="22"/></w:rPr></w:rPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:uiPriority w:val="9"/><w:qFormat/><w:rPr><w:b/><w:sz w:val="32"/></w:rPr></w:style></w:styles>');
 return z.generateAsync({type:'blob',mimeType:DOCX});
}
function render(){const list=$("file-list");list.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.append(`${f.name} `);const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{files.splice(i,1);render()};li.append(b);list.append(li)});const n=files.length;$("batch-options").hidden=n<2;$("convert").disabled=n===0;$("status").textContent=n?`${n} file${n===1?'':'s'} uploaded`:'No files selected'}
$("files").addEventListener('change',event=>{const selectedFiles=event.target.files||[];const normalized=Array.from(selectedFiles);files=files.concat(normalized);event.target.value='';render()});
$("convert").addEventListener('click',async()=>{out=[];const ext=$("format").value;for(const f of files){const text=await f.text();let data=text;if(ext==='json')try{data=JSON.stringify(JSON.parse(text),null,2)}catch{}if(ext==='html')data=`<!doctype html><html><body><pre>${xml(text)}</pre></body></html>`;out.push({name:f.name.replace(/\.[^.]+$/,'')+'.'+(ext==='json'?'json':ext),data})}const list=$("results");list.replaceChildren();out.forEach((o,i)=>{const li=document.createElement('li');li.className='viewer';const b=document.createElement('button');b.type='button';b.className='viewer-toggle';b.textContent=o.name;const body=document.createElement('div');body.className='viewer-body';body.hidden=true;const pre=document.createElement('pre');pre.textContent=o.data;body.append(pre);b.onclick=()=>{body.hidden=!body.hidden};li.append(b,body);list.append(li)});$("results-section").hidden=false;$("export-all").hidden=false;$("result-status").textContent=`${out.length} file${out.length===1?'':'s'} ready`});
$("export-all").addEventListener('click',async()=>{const ext=$("format").value;if(ext==='docx'){const merged=$("single-export").checked||out.length===1;if(merged)save('Easyconvert-merged.docx',await makeDocx(out.flatMap(o=>[{text:o.name,heading:true},{text:o.data},{text:'Thank You',heading:true},{text:thank}])) ,DOCX);else for(const o of out)save(o.name.replace(/\.[^.]+$/i,'.docx'),await makeDocx([{text:o.name,heading:true},{text:o.data}]),DOCX);return}if($("single-export").checked)save(`Easyconvert-merged.${ext}`,out.map(o=>`# ${o.name}\n\n${o.data}`).join('\n\n'),'text/plain');else{const z=new JSZip();out.forEach(o=>z.file(o.name,o.data));save('Easyconvert-bundle.zip',await z.generateAsync({type:'blob'}),'application/zip')}});
render();
})();
</script>
</body>
</html>
