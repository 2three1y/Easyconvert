<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body><h1>Easyconvert</h1><input id="files" type="file" multiple><ul id="file-list"></ul><p id="status">No files selected.</p><select id="format"><option value="txt">TXT</option><option value="docx">DOCX</option><option value="zip">ZIP</option></select><label><input id="single" type="checkbox"> Export as single file</label><button id="convert" type="button" disabled>Convert</button><button id="export" type="button" disabled>Export all</button><button id="clear" type="button">Clear</button><script>(()=>{const $=x=>document.getElementById(x),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';let files=Object.freeze([]),out=Object.freeze([]),busy=false;function render(){const l=$("file-list");l.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.textContent=f.name+' ';const b=document.createElement('button');b.type='button';b.textContent='Remove';b.onclick=()=>{if(!busy){files=Object.freeze(files.filter((_,n)=>n!==i));render()}};li.append(b);l.append(li)});$("convert").disabled=!files.length;$("export").disabled=!out.length;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} selected`:'No files selected'}function download(n,d,t){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([d],{type:t}));a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}async function read(f){return[{name:f.name,content:await f.text()}]}async function makeDocx(t){const z=new JSZip();z.file('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body><w:p><w:r><w:t>${String(t).replace(/[<&>]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</w:t></w:r></w:p><w:sectPr/></w:body></w:document>`);return z.generateAsync({type:'arraybuffer'})}$("files").onchange=e=>{if(!busy){files=Object.freeze(files.concat(Array.from(e.currentTarget.files||[])));render()}};$("convert").onclick=async()=>{if(busy)return;busy=true;try{let r=[];for(const f of files)r.push(...await read(f));out=Object.freeze(r.map(x=>Object.freeze(x)))}finally{busy=false;render()}};$("export").onclick=async e=>{e.preventDefault();if(busy)return;busy=true;const fileSnapshot=Object.freeze(files.slice()),outputSnapshot=Object.freeze(out.map(x=>Object.freeze({name:x.name,content:x.content})));try{if($("single").checked&&$("format").value==='docx'){const t=outputSnapshot.map(x=>`# ${x.name}\n\n${x.content}`).concat('# Thank you for using Easyconvert').join('\n\n');download('Easyconvert-merged.docx',await makeDocx(t),DOCX)}else{const z=new JSZip();outputSnapshot.forEach(x=>z.file(x.name,x.content));download('Easyconvert-bundle.zip',await z.generateAsync({type:'arraybuffer'}),'application/zip')}$("status").textContent=`Export complete (${fileSnapshot.length} files)`}catch(err){console.error(err);$("status").textContent='Export failed; files preserved'}finally{busy=false;render()}};$("clear").onclick=()=>{if(!busy){files=Object.freeze([]);out=Object.freeze([]);render()}};render()})()</script></body></html>
