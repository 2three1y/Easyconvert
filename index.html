<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,input,select{font:inherit;padding:.5rem;margin:.25rem}.file{border-top:1px solid #aaa;padding:.75rem 0}.content{white-space:pre-wrap;max-height:20rem;overflow:auto;background:#f5f5f5;padding:.5rem}.actions{display:inline-flex;gap:.25rem}.status{min-height:1.5em}</style></head><body><h1>Easyconvert</h1><input id="input" type="file" multiple><select id="format" aria-label="Output format"><option>TXT / Markdown</option><option>DOCX</option><option>PDF</option><option>HTML</option><option>JSON</option><option>CSV</option><option>ZIP archive</option></select><button id="convert" type="button">Convert</button><section aria-labelledby="viewer-title"><h2 id="viewer-title">File viewer</h2><button id="toggle" type="button" aria-expanded="true" aria-controls="file-list">Collapse viewer</button><button id="copy-all" type="button">Copy all</button><button id="download-all" type="button">Download all</button><div id="file-list" role="region" tabindex="-1">No files selected.</div></section><p id="status" class="status" role="status" aria-live="polite">No files selected.</p><script>(()=>{'use strict';const byId=id=>document.getElementById(id),files=[],results=[];let busy=false;const status=text=>{const el=byId('status');if(el)el.textContent=text};const download=(name,text)=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};function render(){const list=byId('file-list');if(!list)throw Error('File viewer is unavailable');list.replaceChildren();if(!files.length){list.textContent='No files selected.';return}files.forEach((file,index)=>{const region=document.createElement('section');region.className='file';region.setAttribute('aria-labelledby','file-name-'+index);const bar=document.createElement('div'),name=document.createElement('button');name.id='file-name-'+index;name.type='button';name.textContent=file.name;name.setAttribute('aria-expanded','false');name.setAttribute('aria-controls','file-content-'+index);const actions=document.createElement('span');actions.className='actions';actions.setAttribute('aria-label','File actions: Copy and Download');const copy=document.createElement('button');copy.type='button';copy.textContent='Copy';copy.setAttribute('aria-label','Copy '+file.name);copy.onclick=()=>navigator.clipboard.writeText(results[index]?.content||'').then(()=>status('Copied '+file.name)).catch(e=>status('Copy failed: '+e.message));const down=document.createElement('button');down.type='button';down.textContent='Download';down.setAttribute('aria-label','Download '+file.name);down.onclick=()=>download(file.name,results[index]?.content||'');actions.append(copy,down);bar.append(name,actions);const content=document.createElement('pre');content.id='file-content-'+index;content.className='content';content.hidden=true;content.tabIndex=0;content.setAttribute('aria-label',file.name+' contents');content.textContent=results[index]?.content||'Not converted yet.';name.onclick=()=>{const open=name.getAttribute('aria-expanded')==='true';name.setAttribute('aria-expanded',String(!open));content.hidden=open;if(!open)content.focus()};region.append(bar,content);list.append(region)})}async function convert(){if(busy||!files.length)return;busy=true;status('Converting…');try{results.length=0;for(const file of files){if(file.size>25*1024*1024)throw Error(file.name+' exceeds the 25 MB safety limit');results.push({name:file.name,content:await file.text()});await new Promise(resolve=>requestAnimationFrame(resolve))}render();status('Conversion complete.')}catch(error){try{render()}catch(renderError){console.error(renderError)}status('Conversion failed safely: '+(error&&error.message?error.message:String(error)))}finally{busy=false}}byId('input').addEventListener('change',event=>{try{files.push(...Array.from(event.target.files||[]));render();status(`${files.length} file(s) selected`)}catch(error){status('File selection failed: '+error.message)}});byId('convert').addEventListener('click',event=>{event.preventDefault();convert().catch(error=>status('Conversion failed safely: '+error.message))});byId('toggle').addEventListener('click',()=>{try{const list=byId('file-list'),button=byId('toggle'),open=button.getAttribute('aria-expanded')==='true';list.hidden=open;button.setAttribute('aria-expanded',String(!open));button.textContent=open?'Expand viewer':'Collapse viewer';if(!open)list.focus()}catch(error){status('Viewer toggle failed: '+error.message)}});byId('copy-all').onclick=()=>navigator.clipboard.writeText(results.map(x=>x.content).join('\n\n')).then(()=>status('Copied all files')).catch(e=>status('Copy failed: '+e.message));byId('download-all').onclick=()=>{try{results.forEach(x=>download(x.name,x.content))}catch(e){status('Download failed: '+e.message)}};window.addEventListener('error',event=>{console.error(event.error||event.message);status('Unexpected error: '+(event.message||'The page remains available.'))});try{render()}catch(error){status('Viewer initialization failed: '+error.message)}})();</script></body></html>
