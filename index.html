<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EasyConvert — Offline File Converter</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem;background:#eef2f5;color:#17202a}header{background:#102a43;color:white;padding:2rem;border-radius:10px}section{background:white;padding:1rem;margin:1rem 0;border:1px solid #b8c5cf;border-radius:10px}button,select,input{font:inherit;padding:.65rem;margin:.25rem;border:2px solid #075985;border-radius:6px}button{background:#075985;color:white;font-weight:bold}button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #f59e0b}ul{padding:0;list-style:none}li{margin:.5rem 0}.result{border:1px solid #b8c5cf}.toggle{width:100%;text-align:left;background:white;color:#17202a;border:0}.body{padding:1rem;border-top:1px solid #b8c5cf}pre{white-space:pre-wrap;max-height:25rem;overflow:auto;background:#f4f6f8;padding:1rem}table{border-collapse:collapse;width:100%}th,td{border:1px solid #999;padding:.5rem;text-align:left}caption{text-align:left;font-weight:bold;padding:.5rem}</style></head><body><header role="banner"><h1>EasyConvert</h1><p>Accessible, private, offline file conversion. Your files never leave this device.</p></header><main role="main"><section aria-labelledby="upload"><h2 id="upload">Add files</h2><input id="files" type="file" multiple accept=".json,.csv,.txt,.log,.pdf" aria-label="Choose files to convert"><ul id="file-list" role="list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section><section aria-labelledby="format-heading"><h2 id="format-heading">Choose output type</h2><label for="format">Type needed</label><select id="format" aria-label="Choose EasyConvert output format"><option value="txt">Clean Text / Markdown</option><option value="html">HTML</option><option value="json">JSON formatted</option><option value="csv">CSV</option><option value="docx">DOCX</option></select><p><input id="include-media" type="checkbox" aria-describedby="media-help"><label for="include-media">Include images/figures</label></p><p id="media-help">Applies only when supported images or figures are detected.</p><button id="convert" disabled>Convert File</button></section><section id="results-section" hidden aria-labelledby="results-heading"><h2 id="results-heading">Converted results</h2><button id="all" disabled>Download All Converted Files (ZIP / Folder)</button><p id="result-status" role="status" aria-live="polite"></p><ul id="results" role="list"></ul></section></main><script>(()=>{const $=x=>document.getElementById(x);let files=[],out=[];const thank='Thank you for using EasyConvert!\n\nYour data stayed 100% private, local, and offline on your machine. Nothing was uploaded, transmitted, or tracked.\n';function announce(s){$('status').textContent=s}function render(){let u=$('file-list');u.replaceChildren();files.forEach((f,i)=>{let l=document.createElement('li'),b=document.createElement('button');l.textContent=f.name+' ';b.textContent='Remove '+f.name;b.setAttribute('aria-label','Remove '+f.name);b.onclick=()=>{files.splice(i,1);render();announce(f.name+' removed.')};l.append(b);u.append(l)});$('convert').disabled=!files.length;$('convert').textContent=files.length===1?'Convert File':'Convert '+files.length+' Files'}$('files').onchange=e=>{files.push(...e.target.files);render();e.target.value=''};function csv(t){let R=[],r=[],c='',q=false;for(let i=0;i<t.length;i++){let x=t[i];if(x==='"'){if(q&&t[i+1]==='"'){c+='"';i++}else q=!q}else if(x===','&&!q){r.push(c);c=''}else if((x==='\n'||x==='\r')&&!q){if(x==='\r'&&t[i+1]==='\n')i++;r.push(c);if(r.some(Boolean))R.push(r);r=[];c=''}else c+=x}r.push(c);if(r.some(Boolean))R.push(r);let n=Math.max(0,...R.map(x=>x.length));return R.map(x=>x.concat(Array(n-x.length).fill('')))}function esc(x){return String(x??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}function table(r){return '<table role="table"><caption>CSV data</caption><thead><tr>'+((r[0]||[]).map(x=>'<th scope="col">'+esc(x)+'</th>').join(''))+'</tr></thead><tbody>'+r.slice(1).map(x=>'<tr>'+x.map(y=>'<td>'+esc(y)+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function save(n,d){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=n;a.click()}function renderResults(){let u=$('results');u.replaceChildren();out.concat([{name:'THANK_YOU.txt',data:thank}]).forEach((o,i)=>{let l=document.createElement('li'),b=document.createElement('button'),d=document.createElement('div'),p=document.createElement('pre'),copy=document.createElement('button'),down=document.createElement('button');l.className='result';b.className='toggle';b.textContent=o.name;b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls','file-content-'+i);d.id='file-content-'+i;d.className='body';d.hidden=true;p.textContent=o.data;copy.textContent='Copy Content';down.textContent='Download '+o.name;copy.onclick=()=>navigator.clipboard?.writeText(o.data);down.onclick=()=>save(o.name,o.data);d.append(copy,down,p);b.onclick=()=>{let open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));d.hidden=open};l.append(b,d);u.append(l)});$('results-section').hidden=false;$('all').disabled=!out.length}$('convert').onclick=async()=>{out=[];let f=$('format').value;for(let x of files){let t=await x.text(),d=t;if(/\.csv$/i.test(x.name)&&f==='html')d=table(csv(t));else if(f==='json')try{d=JSON.stringify(JSON.parse(t),null,2)}catch{}out.push({name:x.name.replace(/\.[^.]+$/,'')+'.'+f,data:d})}renderResults();$('result-status').textContent=`EasyConvert completed ${out.length} conversion${out.length===1?'':'s'}; THANK_YOU.txt included.`};})();</script></body></html>
