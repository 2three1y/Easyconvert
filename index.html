<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><title>EasyConvert</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.6rem;margin:.25rem}button{background:#075985;color:white}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f59e0b}.viewer{border:1px solid #b8c5cf;margin:.5rem 0}.viewer-toggle{width:100%;text-align:left;background:#fff;color:#17202a}.viewer-body{padding:1rem;border-top:1px solid #b8c5cf}pre{white-space:pre-wrap;max-height:20rem;overflow:auto}</style></head><body><header><h1>EasyConvert</h1></header><main><section><h2>Add files</h2><input id="files" type="file" multiple accept=".txt,.csv,.json,.zip,application/zip,application/x-zip-compressed" aria-label="Choose files to convert"><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section><section><label for="format">Format</label><select id="format"><option value="txt">TXT / Markdown</option><option value="html">HTML</option><option value="json">Formatted JSON</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label for="single-export"><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" disabled>Convert</button></section><section id="results-section" hidden aria-labelledby="results-heading"><h2 id="results-heading">Results</h2><ul id="results"></ul><button id="export-all" hidden>Export all</button><p id="result-status" role="status" aria-live="polite"></p></section></main><script>(()=>{const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';let files=[],out=[];const thank='Thank you for using EasyConvert!';function save(n,d,t='application/octet-stream'){const a=document.createElement('a');a.download=n;a.href=URL.createObjectURL(new Blob([d],{type:t}));a.click()}function render(){const u=$("file-list");u.replaceChildren();files.forEach((f,i)=>{const l=document.createElement('li'),b=document.createElement('button');l.append(f.name+' ');b.textContent='Remove';b.setAttribute('aria-label','Remove '+f.name);b.onclick=()=>{files.splice(i,1);render()};l.append(b);u.append(l)});const n=files.length;$("batch-options").hidden=n<2;$("convert").disabled=n===0;$("status").textContent=n?`${n} file${n===1?'':'s'} uploaded`:'No files selected'}$("files").addEventListener('change',e=>{files=files.concat(Array.from(e.target.files||[]));render();e.target.value=''})$("convert").onclick=async()=>{out=[];const ext=$("format").value;for(const f of files){let d=await f.text();if(ext==='json')try{d=JSON.stringify(JSON.parse(d),null,2)}catch{}out.push({name:f.name.replace(/\.[^.]+$/,'')+'.'+ext,data:d})}const u=$("results");u.replaceChildren();out.forEach((o,i)=>{const li=document.createElement('li');li.className='viewer';const b=document.createElement('button'),body=document.createElement('div'),pre=document.createElement('pre');b.className='viewer-toggle';b.textContent=o.name;b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls','viewer-'+i);body.id='viewer-'+i;body.className='viewer-body';body.hidden=true;pre.textContent=o.data;body.append(pre);b.onclick=()=>{const open=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!open));body.hidden=open};li.append(b,body);u.append(li)});$("results-section").hidden=false;$("export-all").hidden=false;$("result-status").textContent=`${out.length} file${out.length===1?'':'s'} ready`};$("export-all").onclick=async()=>{const format=$("format").value;if(format==='docx'){for(const o of out)save(o.name.replace(/\.[^.]+$/i,'.docx'),o.data,DOCX);return}if($("single-export").checked){save('EasyConvert-merged.txt',out.map(o=>`# ${o.name}\n\n${o.data}`).join('\n\n')+'\n# Thank You\n'+thank,'text/plain');return}const z=new JSZip;out.forEach(o=>z.file(o.name,o.data));z.generateAsync({type:'blob'}).then(b=>save('EasyConvert-bundle.zip',b,'application/zip'))}})();</script></body></html>
