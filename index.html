<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Easyconvert

<body>
  <h1>Easyconvert
  <input id="files" type="file" multiple accept=".txt,.csv,.json,.zip,application/zip,application/x-zip-compressed">
  <p id="status" role="status" aria-live="polite">No files selected
  <select id="format">
    <option value="txt">TXT / Markdown
    <option value="docx">DOCX
    <option value="zip">ZIP archive
  
  <button id="convert" disabled>Convert
  <ul id="results">
  <script>
    (() => {
      const input = document.getElementById('files');
      const status = document.getElementById('status');
      const convert = document.getElementById('convert');
      const results = document.getElementById('results');
      let files = [];

      function refresh() {
        const n = files.length;
        convert.disabled = n === 0;
        status.textContent = n 
          ? n + ' file' + (n === 1 ? '' : 's') + ' selected' 
          : 'No files selected';
        console.debug('Easyconvert file count:', n);
      }

      input.addEventListener('change', e => {
        const selected = Array.from(e.target.files || []);
        if (selected.length) files = files.concat(selected);
        refresh();
        try { e.target.value = ''; } catch {}
      });

      convert.addEventListener('click', async () => {
        results.replaceChildren(
          ...await Promise.all(files.map(async file => {
            const item = document.createElement('li');
            item.textContent = file.name;
            item.dataset.text = await file.text();
            return item;
          }))
        );
      });
    })();
