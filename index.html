<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><title>EasyConvert</title><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.6rem;margin:.25rem}button{background:#075985;color:white}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #f59e0b}</style></head><body><header><h1>EasyConvert</h1></header><main><section><h2>Add files</h2><input id="files" type="file" multiple aria-label="Choose files to convert"><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p></section><section><label for="format">Format</label><select id="format"><option value="txt">TXT</option><option value="docx">DOCX</option><option value="zip">ZIP</option></select><fieldset id="batch-options" hidden><legend>Batch Options</legend><label for="single-export"><input id="single-export" type="checkbox"> Export as single file</label></fieldset><button id="convert" disabled>Convert</button></section><section id="results-section" hidden><h2>Results</h2><ul id="results"></ul><button id="export-all" hidden>Export all</button><p id="result-status" role="status" aria-live="polite"></p></section></main><script>(()=>{const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document';let files=[],out=[];const thank='Thank you for using EasyConvert!';const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');function save(name,data,type='application/octet-stream'){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(new Blob([data],{type}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function render(){const u=$("file-list");u.replaceChildren();files.forEach((f,i)=>{const l=document.createElement('li'),b=document.createElement('button');l.append(f.name+' ');b.textContent='Remove';b.onclick=()=>{files.splice(i,1);render()};l.append(b);u.append(l)});const n=files.length;$("batch-options").hidden=n<2;$("convert").disabled=n===0;$("status").textContent=n?`${n} file${n===1?'':'s'} uploaded`:'No files selected'}$("files").addEventListener('change',event=>{const selected=Array.from(event?.target?.files||$("files").files||[]);if(selected.length)files=files.concat(selected);render();event.target.value=''});function makeDocx(text){const z=new JSZip,body=`<w:body><w:p><w:pPr><w:pStyle w:val="Heading1"/></w:pPr><w:r><w:t>EasyConvert</w:t></w:r></w:p><w:p><w:r><w:t xml:space="preserve">${esc(text)}</w:t></w:r></w:p><w:sectPr/></w:body>`;z.file('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">${body}</w:document>`);return z.generateAsync({type:'blob'})}$("convert").onclick=async()=>{out=[];const ext=$("format").value;for(const f of files){const base=f.name.replace(/\.[^.]+$/,'');out.push({name:base+'.'+ext,data:await f.text()})}$("results").replaceChildren(...out.map(o=>{const l=document.createElement('li');l.textContent=o.name;return l}));$("results-section").hidden=false;$("export-all").hidden=false;$("result-status").textContent=`${out.length} file${out.length===1?'':'s'} ready`};$("export-all").onclick=async()=>{const format=$("format").value;if(format==='docx'){if($("single-export").checked||out.length===1){save('EasyConvert-merged.docx',await makeDocx(out.map(o=>`# ${o.name}\n\n${o.data}`).join('\n\n')+'\n\n# Thank You\n\n'+thank),DOCX)}else for(const o of out)save(o.name.replace(/\.[^.]+$/i,'.docx'),await makeDocx(o.data),DOCX);return}if($("single-export").checked){save('EasyConvert-merged.txt',out.map(o=>`# ${o.name}\n\n${o.data}`).join('\n\n')+'\n\n# Thank You\n\n'+thank,'text/plain');return}const z=new JSZip;out.forEach(o=>z.file(o.name,o.data));z.generateAsync({type:'blob'}).then(b=>save('EasyConvert-bundle.zip',b,'application/zip'))}})();</script></body></html>
