<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Easyconvert</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><style>body{font:16px system-ui;max-width:900px;margin:auto;padding:1rem}button,select,input{font:inherit;padding:.6rem;margin:.25rem}button{background:#075985;color:#fff}.file{display:flex;gap:.5rem;align-items:center;margin:.3rem 0}.name{flex:1}.preview{white-space:pre-wrap;max-height:12rem;overflow:auto}</style></head><body><main><h1>Easyconvert</h1><input id="files" type="file" multiple><ul id="file-list"></ul><p id="status" role="status" aria-live="polite">No files selected.</p><select id="format"><option value="txt">TXT / Markdown</option><option value="html">HTML</option><option value="json">Formatted JSON</option><option value="csv">CSV</option><option value="docx">DOCX</option><option value="zip">ZIP archive</option></select><label><input id="single-export" type="checkbox"> Export as single file</label><button id="convert" type="button" disabled>Convert</button><section id="results-section" hidden><p id="result-status" role="status" aria-live="polite"></p><button id="export-all" type="button">Export all</button><button id="clear" type="button">Clear</button></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),DOCX='application/vnd.openxmlformats-officedocument.wordprocessingml.document',ZIP='application/zip';let files=[],out=[],exporting=false;const xml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&apos;');function render(){if(exporting)return;const l=$("file-list");l.replaceChildren();files.forEach((f,i)=>{const li=document.createElement('li');li.className='file';const n=document.createElement('span');n.className='name';n.textContent=f.name;const v=document.createElement('button');v.type='button';v.textContent='View';const r=document.createElement('button');r.type='button';r.textContent='Remove';const p=document.createElement('pre');p.className='preview';p.hidden=true;v.onclick=async()=>{p.hidden=!p.hidden;if(!p.hidden&&!p.textContent)try{p.textContent=await f.text()}catch(e){p.textContent=e.message}};r.onclick=()=>{if(!exporting){files.splice(i,1);render()}};li.append(n,v,r,p);l.append(li)});$("convert").disabled=!files.length;$("status").textContent=files.length?`${files.length} file${files.length===1?'':'s'} selected`:'No files selected'}function save(name,data,type){const b=data instanceof Blob?data:new Blob([data],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}function fmt(n,t){if(/\.json$/i.test(n))try{return JSON.stringify(JSON.parse(t),null,2)}catch{}return t}async function read(f){if(!/\.zip$/i.test(f.name)&&!f.type.includes('zip'))return[{name:f.name,content:fmt(f.name,await f.text())}];const z=await JSZip.loadAsync(await f.arrayBuffer()),r=[];for(const [n,e] of Object.entries(z.files))if(!e.dir&&/\.(json|txt|md|csv)$/i.test(n))r.push({name:n,content:fmt(n,await e.async('string'))});return r}async function doc(t){const z=new JSZip(),body=String(t).split(/\r?\n/).map(x=>`<w:p>${/^#\s+/.test(x)?'<w:pPr><w:pStyle w:val="Heading1"/></w:pPr>':''}<w:r><w:t xml:space="preserve">${xml(x.replace(/^#\s+/, '')||' ')}</w:t></w:r></w:p>`).join('');z.file('[Content_Types].xml','<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');z.file('_rels/.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');z.file('word/document.xml',`<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${body}<w:sectPr/></w:body></w:document>`);return z.generateAsync({type:'arraybuffer'})}$("files").onchange=e=>{if(exporting)return;const p=Array.from(e.currentTarget.files||[]);files.push(...p);e.currentTarget.value='';render()};$("convert").onclick=async()=>{if(exporting)return;try{out=[];for(const f of [...files])out.push(...await read(f));$("results-section").hidden=false;$("status").textContent='Conversion complete'}catch(e){$("status").textContent=`Conversion failed: ${e.message}`}};$("export-all").onclick=async e=>{e.preventDefault();if(exporting)return;exporting=true;const fileSnapshot=Object.freeze([...files]),outSnapshot=Object.freeze(out.map(x=>Object.freeze({name:x.name,content:x.content})));try{const ext=$("format").value;if($("single-export").checked&&ext==='docx'){const text=outSnapshot.map(x=>`# ${x.name}\n\n${x.content}`).concat('# Thank you for using Easyconvert').join('\n\n');save('Easyconvert-merged.docx',await doc(text),DOCX)}else{const z=new JSZip();outSnapshot.forEach(x=>z.file(x.name,x.content));save('Easyconvert-bundle.zip',await z.generateAsync({type:'arraybuffer'}),ZIP)}$("result-status").textContent=`Export complete (${fileSnapshot.length} uploaded file${fileSnapshot.length===1?'':'s'})`}catch(e){console.error(e);$("result-status").textContent=`Export failed: ${e.message}`}finally{exporting=false;render()}};$("clear").onclick=()=>{if(!exporting){files=[];out=[];$("results-section").hidden=true;render()}};render()})();</script></body></html>
